name: modelgate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-public-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: ruff check . && ruff format --check .
      - run: pytest -q -W error
      - run: modelgate download
      - run: modelgate train --artifact artifacts/ci --report runs/ci/training.json
      - run: modelgate evaluate --artifact artifacts/ci --output runs/ci/evaluation.json
      - run: modelgate experiment --artifact artifacts/ci --output runs/ci/experiment.json --requests 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelgate-public-data-evidence
          path: runs/ci/
